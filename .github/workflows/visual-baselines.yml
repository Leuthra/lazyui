name: update visual baselines

# Run manually after an intended design change (or a Filament update that changes the look
# on purpose). It regenerates tests/visual/__screenshots__/ci and commits them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      LAZYUI_SNAPSHOTS: ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: npm ci && npx playwright install --with-deps chromium
      - run: composer workbench
      - run: npx playwright test --update-snapshots
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__/ci
          git diff --cached --quiet || git commit -m "Update visual baselines"
          git push
