name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday: run against the newest Filament release, so breaking changes show up here first.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        dependencies: [highest]
        include:
          # The lowest versions composer.json allows (e.g. filament/filament 5.0.0).
          - php: '8.3'
            laravel: '12.*'
            dependencies: lowest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
      - run: composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      - run: composer show filament/filament | grep versions
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit

  assets:
    runs-on: ubuntu-latest
    name: dist/ is up to date
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- dist || (echo "::error::dist/ is stale. Run npm run build and commit." && exit 1)

  visual:
    runs-on: ubuntu-latest
    name: visual regression
    env:
      LAZYUI_SNAPSHOTS: ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: npm ci && npx playwright install --with-deps chromium
      - run: composer workbench
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            playwright-report
            test-results
